<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark background gradient matching the logo -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>

    <!-- Gold border glow gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0c060"/>
      <stop offset="40%" stop-color="#d4a020"/>
      <stop offset="100%" stop-color="#8a6000"/>
    </linearGradient>

    <!-- Silver gradient for the M letter -->
    <linearGradient id="silverM" x1="0%" y1="0%" x2="30%" y2="100%">
      <stop offset="0%" stop-color="#f0f0f0"/>
      <stop offset="35%" stop-color="#d8d8d8"/>
      <stop offset="70%" stop-color="#a0a0a0"/>
      <stop offset="100%" stop-color="#c8c8c8"/>
    </linearGradient>

    <!-- Inner shadow for 3D M depth -->
    <linearGradient id="mShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#606060"/>
      <stop offset="100%" stop-color="#303030"/>
    </linearGradient>

    <!-- Gold gradient for the L letter -->
    <linearGradient id="goldL" x1="0%" y1="0%" x2="40%" y2="100%">
      <stop offset="0%" stop-color="#f5cc60"/>
      <stop offset="50%" stop-color="#c8920a"/>
      <stop offset="100%" stop-color="#a07000"/>
    </linearGradient>

    <!-- L face side shadow -->
    <linearGradient id="lSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a5a00"/>
      <stop offset="100%" stop-color="#604000"/>
    </linearGradient>

    <!-- Drop shadow filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Gold border glow filter -->
    <filter id="glow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="512" height="512" rx="110" ry="110" fill="url(#bg)"/>

  <!-- Gold outer border (stroke) -->
  <rect x="8" y="8" width="496" height="496" rx="104" ry="104"
        fill="none" stroke="url(#goldBorder)" stroke-width="10" filter="url(#glow)"/>

  <!-- =====================================================
       M LETTER — Silver 3D folded ribbon shape
       3 vertical pillars connected by angled valley pieces
       ===================================================== -->

  <!-- Left pillar of M -->
  <path d="M 100 165 L 130 165 L 130 350 L 100 350 Z" fill="url(#silverM)"/>

  <!-- Left pillar — right face (3D depth) -->
  <path d="M 130 165 L 148 148 L 148 333 L 130 350 Z" fill="url(#mShadow)"/>

  <!-- Left slope down (valley) -->
  <path d="M 130 165 L 175 245 L 175 268 L 148 248 L 148 148 Z" fill="url(#silverM)"/>

  <!-- Center valley bottom -->
  <path d="M 175 245 L 205 200 L 235 245 L 235 268 L 205 223 L 175 268 Z" fill="url(#mShadow)"/>

  <!-- Right slope up (valley) -->
  <path d="M 235 245 L 280 165 L 310 165 L 265 265 L 235 268 Z" fill="url(#silverM)"/>

  <!-- Right pillar of M -->
  <path d="M 280 165 L 310 165 L 310 350 L 280 350 Z" fill="url(#silverM)"/>

  <!-- Right pillar — right face (3D depth, transitions into gold L) -->
  <path d="M 310 165 L 328 148 L 328 185 L 310 200 Z" fill="url(#mShadow)"/>

  <!-- =====================================================
       L LETTER — Gold 3D block shape
       Shares the right side of M, extends right and down
       ===================================================== -->

  <!-- L vertical bar (front face) -->
  <path d="M 310 165 L 368 165 L 368 310 L 310 310 Z" fill="url(#goldL)"/>

  <!-- L vertical bar — right face (3D depth) -->
  <path d="M 368 165 L 400 148 L 400 293 L 368 310 Z" fill="url(#lSide)"/>

  <!-- L horizontal foot (front face) -->
  <path d="M 310 310 L 410 310 L 410 350 L 310 350 Z" fill="url(#goldL)"/>

  <!-- L horizontal foot — top face (3D depth, angled) -->
  <path d="M 368 310 L 400 293 L 440 293 L 410 310 Z" fill="url(#lSide)"/>

  <!-- L corner bottom-right 3D edge -->
  <path d="M 410 310 L 440 293 L 440 333 L 410 350 Z" fill="url(#lSide)"/>
</svg>
